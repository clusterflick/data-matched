on:
  workflow_dispatch:
  repository_dispatch:
    types: [release_event]

name: Match Data

concurrency:
  group: match-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check_already_run:
    name: Check if release already created today
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for release today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Europe/London date +'%Y%m%d')

          # Get the latest release tag
          LATEST_TAG=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/latest" \
            --jq '.tag_name' 2>/dev/null || echo "")

          # Tags are formatted as YYYYMMDD.HHMMSS, so check if it starts with today's date
          if [[ "$LATEST_TAG" == ${TODAY}.* ]]; then
            echo "Release already created today (tag: $LATEST_TAG). Skipping."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "No release today (latest: $LATEST_TAG). Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  match_with_bechdel:
    name: Match with Bechdel Test
    needs: check_already_run
    if: needs.check_already_run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      MOVIEDB_API_KEY: ${{ secrets.MOVIEDB_API_KEY }}
    steps:
      - uses: clusterflick/.github/setup@main
      - name: Download cached data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-cached"
          latest: true
          fileName: "*"
          out-file-path: "cached-data"
      - name: Download combined data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-combined"
          latest: true
          fileName: "*"
          out-file-path: "combined-data"
      - name: Match Data
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          retry_wait_seconds: 30
          max_attempts: 10
          command: npm run match -- bechdel
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: match_with_bechdel
          path: matched-data/

  match_with_imdb:
    name: Match with IMDB
    needs: check_already_run
    if: needs.check_already_run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      MOVIEDB_API_KEY: ${{ secrets.MOVIEDB_API_KEY }}
    steps:
      - uses: clusterflick/.github/setup@main
      - name: Download cached data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-cached"
          latest: true
          fileName: "*"
          out-file-path: "cached-data"
      - name: Download combined data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-combined"
          latest: true
          fileName: "*"
          out-file-path: "combined-data"
      - name: Match Data
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          retry_wait_seconds: 30
          max_attempts: 10
          command: npm run match -- imdb
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: match_with_imdb
          path: matched-data/

  match_with_letterboxd:
    name: Match with Letterboxd
    needs: check_already_run
    if: needs.check_already_run.outputs.should_run == 'true'
    # Macs only: a Letterboxd page costs 1-2s on a Mac against ~7s on a Pi,
    # whose CPU the page's ad scripts compete for, so a full run is about an
    # hour rather than about four. Match runs after transform, when the Macs
    # are idle. With none online this job waits rather than falling back to a
    # Pi, which is accepted: the site keeps the previous matched release.
    runs-on: [self-hosted, macOS]
    env:
      MOVIEDB_API_KEY: ${{ secrets.MOVIEDB_API_KEY }}
    steps:
      - uses: clusterflick/.github/setup@main
        with:
          playwright: true
      - name: Download cached data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-cached"
          latest: true
          fileName: "*"
          out-file-path: "cached-data"
      - name: Download combined data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-combined"
          latest: true
          fileName: "*"
          out-file-path: "combined-data"
      - name: Match Data
        uses: nick-fields/retry@v4
        with:
          # The job's own 6-hour limit is the real bound: a slow full run has
          # taken 3.5h+, and a timed-out attempt only restarts from the cache.
          # The action requires a timeout, so it is set to that same limit.
          timeout_minutes: 360
          retry_wait_seconds: 30
          max_attempts: 10
          command: npm run match -- letterboxd
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: match_with_letterboxd
          path: matched-data/
      - name: Save test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: retrieve_sources-playwright-failures
          path: ./playwright-failures

  match_with_metacritic:
    name: Match with Metacritic
    needs: check_already_run
    if: needs.check_already_run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      MOVIEDB_API_KEY: ${{ secrets.MOVIEDB_API_KEY }}
    steps:
      - uses: clusterflick/.github/setup@main
      - name: Download cached data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-cached"
          latest: true
          fileName: "*"
          out-file-path: "cached-data"
      - name: Download combined data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-combined"
          latest: true
          fileName: "*"
          out-file-path: "combined-data"
      - name: Match Data
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          retry_wait_seconds: 30
          max_attempts: 10
          command: npm run match -- metacritic
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: match_with_metacritic
          path: matched-data/

  match_with_moviedb:
    name: Match with The Movie DB
    needs: check_already_run
    if: needs.check_already_run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      MOVIEDB_API_KEY: ${{ secrets.MOVIEDB_API_KEY }}
    steps:
      - uses: clusterflick/.github/setup@main
      - name: Download cached data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-cached"
          latest: true
          fileName: "*"
          out-file-path: "cached-data"
      - name: Download combined data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-combined"
          latest: true
          fileName: "*"
          out-file-path: "combined-data"
      - name: Match Data
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          retry_wait_seconds: 30
          max_attempts: 10
          command: npm run match -- moviedb
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: match_with_moviedb
          path: matched-data/

  match_with_rotten_tomatoes:
    name: Match with Rotten Tomatoes
    needs: check_already_run
    if: needs.check_already_run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      MOVIEDB_API_KEY: ${{ secrets.MOVIEDB_API_KEY }}
    steps:
      - uses: clusterflick/.github/setup@main
      - name: Download cached data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-cached"
          latest: true
          fileName: "*"
          out-file-path: "cached-data"
      - name: Download combined data
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-combined"
          latest: true
          fileName: "*"
          out-file-path: "combined-data"
      - name: Match Data
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          retry_wait_seconds: 30
          max_attempts: 10
          command: npm run match -- rottentomatoes
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: match_with_rotten_tomatoes
          path: matched-data/

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    # ncipollo/release-action creates a release + tag via GITHUB_TOKEN,
    # which requires contents: write (top-level default is contents: read).
    # actions: read lets download-artifact use the REST API - see below.
    permissions:
      contents: write
      actions: read
    needs:
      [
        check_already_run,
        match_with_bechdel,
        match_with_imdb,
        match_with_letterboxd,
        match_with_metacritic,
        match_with_moviedb,
        match_with_rotten_tomatoes,
      ]
    if: needs.check_already_run.outputs.should_run == 'true'
    steps:
      - name: Download All Artifacts
        # Without github-token this uses the internal artifact service, whose
        # GetSignedArtifactURL call intermittently 404s ("workflow run not
        # found") on runs with several re-run attempts. Passing a token
        # switches it to the REST API, which resolves artifacts reliably.
        uses: actions/download-artifact@v8
        with:
          pattern: match_with_*
          path: matched-data/
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Generate Tag
        run: echo "TAG=$(TZ=Europe/London date +'%Y%m%d.%H%M%S')" >> $GITHUB_ENV
      - uses: ncipollo/release-action@v1
        id: release
        # A failed upload is retried by the next step, which fails the job if
        # it fails too.
        continue-on-error: true
        with:
          allowUpdates: false
          artifactErrorsFailBuild: true
          artifacts: "matched-data/*"
          # Create as a draft, attach every artifact, then publish. Without this
          # the release is published empty and filled asset by asset, so for as
          # long as the upload runs `releases/latest` is a partial snapshot, and
          # a failed upload leaves one there. The retry below relies on it too:
          # it finds the draft by tag and finishes it.
          immutableCreate: true
          makeLatest: true
          tag: ${{ env.TAG }}
          commit: main
          body: &release-body |
            ⚠️ **Internal build artifact — not licensed.** Every rating here belongs to the source it came from (IMDb, Letterboxd, Metacritic, Rotten Tomatoes, TMDB, the Bechdel Test) and Clusterflick grants no rights over any of it. Bechdel Test ratings additionally carry a [CC BY-NC 3.0](https://creativecommons.org/licenses/by-nc/3.0/) non-commercial restriction. No schema guarantees; changes without notice. For data you can use, see https://clusterflick.com/data-licence

            Created by job ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The upload above can fail on an asset GitHub has in fact stored: the
      # asset is saved, a 5xx comes back anyway, the action uploads it again and
      # gets `already_exists`, which its retry (5xx only) does not handle. That
      # voided a run whose every job had passed. This goes again on the same
      # tag: it finds the draft (or creates one, if the first attempt never got
      # that far), and uploads everything again - before uploading, the action
      # by default deletes any asset already attached under the same name, so
      # what the first attempt got up is replaced rather than colliding.
      #
      # `draft: true` because an update publishes the release *before* it
      # uploads unless told otherwise - the partial `releases/latest` that
      # immutableCreate exists to prevent - so the next step publishes it.
      - name: Retry Release Upload
        if: steps.release.outcome == 'failure'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: true
          artifactErrorsFailBuild: true
          artifacts: "matched-data/*"
          makeLatest: true
          tag: ${{ env.TAG }}
          commit: main
          body: *release-body
      - name: Publish Retried Release
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Output summary
        run: |
          echo "🔖 New release - ${{ steps.release.outputs.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, env.TAG) }}" >> $GITHUB_STEP_SUMMARY

  trigger_downstream:
    name: Trigger downstream
    runs-on: ubuntu-latest
    needs: [create_release]
    # Only run if a new release was created (not when skipped due to existing release)
    if: success()
    steps:
      - name: Repository Dispatch for clusterflick.com
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: clusterflick/clusterflick.com
          event-type: release_event
